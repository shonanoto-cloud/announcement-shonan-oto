<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路線案内・発車メロディ紹介（レスポンシブ＆連動版）</title>
    <style>
        /* ==========================================================================
           1. カスタマイズ変数
           ========================================================================== */
        :root {
            --line-color: #c92334;       /* 路線のメインカラー */
            --bg-color-light: #f8f9fa;   /* 駅背景の互い違い色1 */
            --bg-color-dark: #ffffff;    /* 駅背景の互い違い色2 */
            --text-main: #1a2530;        /* メイン文字色 */
            --text-sub: #616d7a;         /* 補足文字色 */
            --sidebar-width: 450px;      /* PC時の左側エリアの幅 */
        }

        /* ==========================================================================
           2. 全体レイアウト（ベースはPC向け）
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f2f5;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側：路線図サイドバー */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: #ffffff;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            z-index: 10;
        }

        /* 右側：メインコンテンツ表示エリア */
        .main-content {
            flex-grow: 1;
            height: 100%;
            overflow-y: auto;
            padding: 40px;
            background-color: #f0f2f5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* ==========================================================================
           3. ヘッダー・タイムライン共通（前枠通り）
           ========================================================================== */
        .header {
            background-color: #ffffff;
            text-align: center;
            padding: 24px 15px;
            border-bottom: 1px solid #e1e5e8;
        }
        .header h1 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: bold;
            margin-bottom: 8px;
        }
        .line-badge {
            display: inline-block;
            background-color: var(--line-color);
            color: #ffffff;
            padding: 4px 18px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .timeline-scroll {
            flex-grow: 1;
            overflow-y: auto;
        }
        .timeline { width: 100%; position: relative; }

        .station-block {
            display: flex;
            position: relative;
            min-height: 150px;
            cursor: pointer;
        }
        .station-block:nth-child(odd) { background-color: var(--bg-color-light); }
        .station-block:nth-child(even) { background-color: var(--bg-color-dark); }
        .station-block:hover { background-color: #eef2f7 !important; }
        
        /* 現在右側に詳細が出ている駅をハイライトするCSSクラス */
        .station-block.is-active {
            background-color: #e0e8f5 !important;
        }

        .route-track {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 20px;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }
        .route-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background-color: var(--line-color);
            z-index: 1;
        }
        .station-block:first-child .route-line { top: 46px; }

        .station-dot {
            position: absolute;
            top: 40px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid var(--line-color);
            border-radius: 50%;
            z-index: 2;
            transition: background-color 0.2s;
        }
        /* アクティブな駅の丸ポチを塗りつぶす */
        .station-block.is-active .station-dot {
            background-color: var(--line-color);
        }

        .station-info { width: 50%; padding: 30px 10px 20px 24px; z-index: 3; }
        .station-number {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--line-color);
            border-radius: 4px;
            width: 32px;
            height: 32px;
            font-size: 0.7rem;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 8px;
            background-color: #ffffff;
        }

        /* aタグから、クリックイベントを受け持つbuttonタグへ変更（SEO・デザイン最適化） */
        .station-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
            text-align: left;
        }
        .station-name::after {
            content: '›';
            color: #2ca85a;
            font-size: 1.6rem;
            line-height: 1;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .station-name:hover::after { transform: translateX(6px); }

        .station-features { width: 50%; padding: 30px 24px 20px 15px; display: flex; flex-direction: column; z-index: 3; }
        .melody-container { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .melody-row { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; }
        .track-badge { background-color: #555555; color: #ffffff; font-weight: bold; padding: 2px 6px; border-radius: 3px; white-space: nowrap; font-size: 0.7rem; }
        .melody-name { color: var(--text-sub); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* フッター */
        .footer-terminal { display: flex; position: relative; padding-top: 24px; padding-bottom: 40px; background-color: var(--bg-color-dark); }
        .footer-terminal .route-line { bottom: 30px; }
        .transfer-container { position: relative; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 3; }
        .transfer-button { display: flex; align-items: center; justify-content: center; gap: 6px; background-color: #ffffff; width: 130px; height: 36px; border-radius: 18px; font-size: 0.9rem; font-weight: bold; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 2px solid #616d7a; color: #616d7a; }
        .transfer-button span { font-size: 0.8rem; margin-top: -2px; }

        /* ==========================================================================
           4. 右側：詳細解説カード
           ========================================================================== */
        .detail-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #e1e5e8;
            position: relative;
        }

        /* スマホ時のみ使用する「閉じるボタン」PCでは非表示 */
        .close-detail-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: #eef2f7;
            border: none;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: bold;
        }

        .detail-header { border-bottom: 3px solid var(--line-color); padding-bottom: 15px; margin-bottom: 30px; display: flex; align-items: baseline; gap: 15px; }
        .detail-station-name { font-size: 2.2rem; font-weight: bold; }
        .detail-station-sub { font-size: 1.1rem; color: var(--text-sub); }
        .audio-player-placeholder { background-color: #f8f9fa; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px; text-align: center; color: var(--text-sub); margin-bottom: 30px; font-weight: bold; }
        .commentary-box { line-height: 1.8; color: #334155; }
        .commentary-box h3 { font-size: 1.2rem; margin-bottom: 10px; color: var(--text-main); }

        /* ==========================================================================
           5. 【重要】レスポンシブ・メディアクエリ（横幅が900px以下になった時）
           ========================================================================== */
        @media screen and (max-width: 900px) {
            body {
                flex-direction: column; /* 縦並びに変更 */
            }

            .sidebar {
                width: 100%; /* 駅一覧を画面いっぱいに広げる */
                min-width: 100%;
                height: 100%;
            }

            /* 詳細画面をスマホ用ポップアップ（全画面オーバーレイ）に変身させる */
            .main-content {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 100;
                padding: 20px;
                background-color: rgba(240, 242, 245, 0.98); /* 背景をわずかに透過 */
                
                /* 初期状態は画面の外（右側）に隠しておく */
                transform: translateX(100%);
                opacity: 0;
                pointer-events: none;
            }

            /* 駅名がタップされて詳細が開いた時の状態 */
            .main-content.is-open {
                transform: translateX(0);
                opacity: 1;
                pointer-events: auto;
            }

            .detail-card {
                height: 100%;
                overflow-y: auto;
                padding: 30px 20px;
            }

            /* スマホの時だけ閉じるボタン「×」を表示 */
            .close-detail-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h1>京葉線 発車メロディ一覧</h1>
            <span class="line-badge">蘇我方面</span>
        </div>

        <div class="timeline-scroll">
            <div class="timeline">

                <div class="station-block is-active" onclick="showDetail(this)" 
                     data-name="東京駅" 
                     data-sub="Tokyo Station" 
                     data-comment="京葉地下ホーム1〜4番線では、長年テイチク製の「Verde Rayo V2」が使用されています。地下深く反響しやすい空間に響き渡る独特の爽やかな旋律が特徴で、ディズニーリゾートに向かう旅行客や通勤客を日々送り出しています。">
                    <div class="route-track">
                        <div class="route-line"></div>
                        <div class="station-dot"></div>
                    </div>
                    
                    <div class="station-info">
                        <div class="station-number">JE<div>01</div></div>
                        <div>
                            <button class="station-name">東京</button>
                        </div>
                    </div>
                    <div class="station-features">
                        <div class="melody-container">
                            <div class="melody-row">
                                <span class="track-badge">1〜4番線</span>
                                <span class="melody-name">Verde Rayo V2</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="station-block" onclick="showDetail(this)" 
                     data-name="八丁堀駅" 
                     data-sub="Hatchobori Station" 
                     data-comment="1番線（蘇我方面）は爽快感のある爽やかな『Over』、2番線（東京方面）は小気味よいテンポで人気の高い『シンコペーション』が採用されています。地下駅のため音が非常によく響きます。">
                    <div class="route-track">
                        <div class="route-line"></div>
                        <div class="station-dot"></div>
                    </div>

                    <div class="station-info">
                        <div class="station-number">JE<div>02</div></div>
                        <div>
                            <button class="station-name">八丁堀</button>
                        </div>
                    </div>
                    <div class="station-features">
                        <div class="melody-container">
                            <div class="melody-row">
                                <span class="track-badge" style="background-color: #2ca85a;">1番線</span>
                                <span class="melody-name">Over</span>
                            </div>
                            <div class="melody-row">
                                <span class="track-badge" style="background-color: #c92334;">2番線</span>
                                <span class="melody-name">シンコペーション</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="station-block" onclick="showDetail(this)" 
                     data-name="蘇我駅" 
                     data-sub="Soga Station" 
                     data-comment="京葉線の終着駅である蘇我駅の3・4番線ホームでは、おなじみの『Over』が鳴り響きます。ここから内房線・外房線へと直通していく列車も多く、房総半島への玄関口としての活気を感じさせるメロディです。">
                    <div class="route-track">
                        <div class="route-line"></div>
                        <div class="station-dot"></div>
                    </div>

                    <div class="station-info">
                        <div class="station-number">JE<div>17</div></div>
                        <div>
                            <button class="station-name">蘇我</button>
                        </div>
                    </div>
                    <div class="station-features">
                        <div class="melody-container">
                            <div class="melody-row">
                                <span class="track-badge">3・4番線</span>
                                <span class="melody-name">Over</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="footer-terminal">
                    <div class="route-line" style="left: 50%; transform: translateX(-50%);"></div>
                    <div class="transfer-container">
                        <a href="#" class="transfer-button" style="border-color: #c92334; color: #c92334;">
                            外房線 <span>❯</span>
                        </a>
                        <a href="#" class="transfer-button" style="border-color: #0070bc; color: #0070bc;">
                            内房線 <span>❯</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <main class="main-content" id="detailSpace">
        <div class="detail-card">
            <button class="close-detail-btn" onclick="closeDetail()">×</button>

            <div class="detail-header">
                <span class="detail-station-name" id="dstName">東京駅</span>
                <span class="detail-station-sub" id="dstSub">Tokyo Station</span>
            </div>

            <div class="audio-player-placeholder">
                🎵 ここに音源プレイヤーや動画、または駅の画像を挿入できます
            </div>

            <div class="commentary-box">
                <h3>発車メロディ解説</h3>
                <p id="dstText">京葉地下ホーム1〜4番線では、長年テイチク製の「Verde Rayo V2」が使用されています。地下深く反響しやすい空間に響き渡る独特の爽やかな旋律が特徴で、ディズニーリゾートに向かう旅行客や通勤客を日々送り出しています。</p>
            </div>
        </div>
    </main>

    <script>
        function showDetail(element) {
            // 1. すべての駅のアクティブ状態（薄青ハイライト）を一度解除
            const blocks = document.querySelectorAll('.station-block');
            blocks.forEach(b => b.classList.remove('is-active'));

            // 2. クリックされた駅をハイライト
            element.classList.add('is-active');

            // 3. クリックされた駅の HTML内「data-*」属性からデータを抽出
            const name = element.getAttribute('data-name');
            const sub = element.getAttribute('data-sub');
            const comment = element.getAttribute('data-comment');

            // 4. 右側の詳細エリアのテキストを瞬時に書き換え
            document.getElementById('dstName').innerText = name;
            document.getElementById('dstSub').innerText = sub;
            document.getElementById('dstText').innerText = comment;

            // 5. 【スマホ用】詳細画面に「is-open」クラスをつけて右からスライドインさせる
            document.getElementById('detailSpace').classList.add('is-open');
        }

        // スマホ用：詳細画面を閉じて駅一覧に戻る関数
        function closeDetail() {
            document.getElementById('detailSpace').classList.remove('is-open');
        }
    </script>

</body>
</html>
